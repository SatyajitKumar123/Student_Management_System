<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- THIS IS THE MAGIC LINE FOR MOBILE RESPONSIVENESS -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Responsive Navigation -->
    <nav class="bg-white shadow mb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row md:justify-between md:h-16">
                <!-- Logo and Links Area -->
                <div class="flex flex-col md:flex-row md:items-center py-4 md:py-0">
                    <div class="flex-shrink-0 flex items-center mb-4 md:mb-0">
                        <a href="{% url 'dashboard' %}" class="text-xl font-bold text-indigo-600">SMS Portal</a>
                    </div>
                    <!-- Links (Always visible now, stacked on mobile) -->
                    <div class="flex flex-col md:flex-row md:ml-6 md:space-x-8 space-y-2 md:space-y-0">
                        <a href="{% url 'dashboard' %}" class="text-gray-900 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">
                            Dashboard
                        </a>
                        <a href="{% url 'student_list' %}" class="text-gray-900 hover:text-indigo-600 px-3 py-2 rounded-md text-sm font-medium">
                            Students
                        </a>
                    </div>
                </div>
                
                <!-- Login/Logout Area -->
                <div class="flex items-center mt-4 md:mt-0">
                    {% if user.is_authenticated %}
                        <span class="mr-4 text-sm text-gray-500">Hello, {{ user.username }}</span>
                        <form action="{% url 'logout' %}" method="post" class="inline">
                            {% csrf_token %}
                            <button type="submit" class="text-sm text-indigo-600 hover:text-indigo-900 font-medium">
                                Logout
                            </button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="text-sm text-indigo-600 hover:text-indigo-900 font-medium">Login</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-10">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 text-sm text-blue-700 bg-blue-100 rounded-lg" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
