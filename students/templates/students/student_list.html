{% extends 'base.html' %}

{% block content %}
<div class="md:flex md:items-center md:justify-between mb-6">
    <div class="flex-1 min-w-0">
        <h2 class="text-2xl font-bold leading-7 text-gray-900 sm:text-3xl sm:truncate">
            Students Directory
        </h2>
    </div>
    <div class="mt-4 flex space-x-3 md:mt-0 md:ml-4">
        <!-- EXPORT BUTTON -->
        <!-- Passes the current course filter so you only download what you see -->
        <a href="{% url 'student_export' %}?course={{ current_course }}" class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Export CSV
        </a>
        
        <!-- ADD BUTTON -->
        <a href="{% url 'student_add' %}" class="inline-flex items-center px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Add New Student
        </a>
    </div>
</div>

<!-- SEARCH AND FILTER FORM -->
<form method="GET" action="{% url 'student_list' %}" class="mb-6 bg-white p-4 rounded-lg shadow sm:flex sm:items-center sm:space-x-4">
    
    <!-- Text Search -->
    <div class="relative flex-grow mb-4 sm:mb-0">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
            </svg>
        </div>
        <input 
            type="text" 
            name="q" 
            value="{{ current_query }}"
            class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-md leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" 
            placeholder="Search by name or enrollment number..."
            hx-get="{% url 'student_list' %}"
            hx-trigger="keyup changed delay:500ms"
            hx-target="#student-results"
            hx-include="[name='course']" 
        >
    </div>

    <!-- COURSE FILTER DROPDOWN -->
    <div class="sm:w-1/4">
        <select 
            name="course" 
            class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"
            hx-get="{% url 'student_list' %}"
            hx-target="#student-results"
            hx-include="[name='q']"
        >
            <option value="">All Courses</option>
            {% for code, name in course_choices %}
                <option value="{{ code }}" {% if current_course == code %}selected{% endif %}>{{ name }}</option>
            {% endfor %}
        </select>
    </div>
</form>

<!-- Results Container -->
<div id="student-results">
    {% include 'students/partials/student_list_results.html' %}
</div>

{% endblock %}
