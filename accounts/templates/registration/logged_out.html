{% extends 'base.html' %}

{% block content %}
<div class="min-h-[50vh] flex flex-col justify-center items-center py-12 sm:px-6 lg:px-8">
    <div class="bg-white py-8 px-10 shadow sm:rounded-lg text-center">
        <h2 class="text-2xl font-bold text-gray-900 mb-4">
            You have been logged out
        </h2>
        <p class="text-gray-600 mb-6">
            Thank you for using the Student Management System.
        </p>
        <a href="{% url 'login' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Log in again
        </a>
    </div>
</div>
{% endblock %}
